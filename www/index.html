<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ResumeForge — Resume Builder</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent:#0077cc;
      --bg:#fff;
      --text:#222;
      --muted:#666;
      --shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box}
    body{font-family:Roboto,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:var(--text)}
    .app{display:flex;gap:20px;padding:20px;max-width:1200px;margin:0 auto}
    .panel{width:360px;background:#fff;padding:16px;border-radius:8px;box-shadow:var(--shadow);overflow:auto}
    .preview-wrap{flex:1;background:transparent}
    h1{font-size:18px;margin:0 0 12px}
    label{display:block;margin:12px 0 6px;font-size:13px;color:var(--muted)}
    input[type=text],input[type=email],textarea,select{width:100%;padding:8px;border:1px solid #e2e6ea;border-radius:6px}
    textarea{min-height:64px}
    .row{display:flex;gap:8px}
    .row > *{flex:1}
    button{background:var(--accent);color:#fff;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
    .muted{color:var(--muted);font-size:13px}
    .small{font-size:13px;padding:6px}

    /* Resume preview styles (5 templates) */
    .resume{background:var(--bg);padding:28px;border-radius:6px;color:var(--text);max-width:880px;margin:0 auto}
    .resume .name{font-family:Merriweather,serif;font-size:28px;font-weight:700;color:var(--accent)}
    .resume .contact{font-size:13px;color:var(--muted);margin-bottom:12px}
    .section{margin:12px 0}
    .section h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
    .job{margin-bottom:8px}
    .skills{display:flex;gap:8px;flex-wrap:wrap}
    .skill{background:rgba(0,0,0,0.06);padding:6px 8px;border-radius:999px;font-size:12px}

    /* Template variations */
    .tpl-classic .sidebar{display:none}
    .tpl-sidebar .resume{display:grid;grid-template-columns:1fr 260px;gap:20px}
    .tpl-sidebar .sidebar{padding-left:10px;border-left:1px solid #eee}
    .tpl-minimal .name{font-size:22px}
    .tpl-bold .name{font-size:34px;letter-spacing:1px}
    .tpl-compact .resume{padding:18px}
    .tpl-compact .skills{gap:6px}

    /* two column compact specifics */
    .tpl-compact .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .list{margin-top:8px}
    .list-item{display:flex;gap:8px;margin-bottom:8px}
    .list-item input{flex:1}
    .btn-ghost{background:transparent;border:1px solid #e0e0e0;color:var(--text)}

    footer{margin-top:8px;font-size:13px;color:var(--muted)}
    @media (max-width:900px){.app{flex-direction:column}.panel{width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>ResumeForge</h1>
      <div class="muted">Live editor — pick template, edit sections, export PDF</div>

      <label>Template</label>
      <select id="templateSelect">
        <option value="tpl-classic">Classic</option>
        <option value="tpl-sidebar">Sidebar</option>
        <option value="tpl-minimal">Minimal</option>
        <option value="tpl-bold">Bold Header</option>
        <option value="tpl-compact">Compact Two-Column</option>
      </select>

      <label>Accent color</label>
      <input type="color" id="accentColor" value="#0077cc">

      <label>Full name</label>
      <input id="nameInput" type="text" placeholder="Jane Doe" value="Jane Q. Developer">

      <label>Headline / Title</label>
      <input id="titleInput" type="text" placeholder="Frontend Engineer — React, TypeScript" value="Frontend Engineer — React, TypeScript">

      <label>Contact (email | phone | website)</label>
      <input id="contactInput" type="text" value="jane@example.com • (555) 123-4567 • example.com">

      <div class="list">
        <label>Experience</label>
        <div id="experienceList"></div>
        <div class="controls">
          <button id="addExp" class="small">+ Add experience</button>
        </div>
      </div>

      <div class="list">
        <label>Education</label>
        <div id="educationList"></div>
        <div class="controls">
          <button id="addEdu" class="small">+ Add education</button>
        </div>
      </div>

      <div class="list">
        <label>Skills (comma separated)</label>
        <input id="skillsInput" type="text" value="JavaScript, React, TypeScript, CSS">
      </div>

      <div style="margin-top:12px;display:flex;gap:8px">
        <button id="exportPdf">Export PDF</button>
        <button id="resetBtn" class="btn-ghost">Reset demo</button>
      </div>

      <footer>Built for web; loads Google Fonts & html2pdf from CDN (no offline caching).</footer>
    </aside>

    <div class="preview-wrap">
      <div id="resumeContainer" class="resume tpl-classic">
        <div id="resumePreview" class="resume">
          <!-- content injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
  <script>
    // Simple state
    const state = {
      template: 'tpl-classic',
      accent: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0077cc',
      name: 'Jane Q. Developer',
      title: 'Frontend Engineer — React, TypeScript',
      contact: 'jane@example.com • (555) 123-4567 • example.com',
      experience: [
        {role:'Senior Frontend Engineer',org:'Acme Corp',period:'2021—Present',desc:'Led UI rebuild; improved performance and accessibility.'},
        {role:'Frontend Engineer',org:'Widget Co',period:'2018—2021',desc:'Built components and design system.'}
      ],
      education: [
        {degree:'B.Sc. Computer Science',org:'State University',period:'2014—2018'}
      ],
      skills: ['JavaScript','React','TypeScript','CSS']
    }

    // DOM refs
    const templateSelect = document.getElementById('templateSelect')
    const accentColor = document.getElementById('accentColor')
    const nameInput = document.getElementById('nameInput')
    const titleInput = document.getElementById('titleInput')
    const contactInput = document.getElementById('contactInput')
    const experienceList = document.getElementById('experienceList')
    const addExp = document.getElementById('addExp')
    const educationList = document.getElementById('educationList')
    const addEdu = document.getElementById('addEdu')
    const skillsInput = document.getElementById('skillsInput')
    const exportPdf = document.getElementById('exportPdf')
    const resetBtn = document.getElementById('resetBtn')
    const resumeContainer = document.getElementById('resumeContainer')
    const resumePreview = document.getElementById('resumePreview')

    // render functions
    function renderEditorLists(){
      experienceList.innerHTML = ''
      state.experience.forEach((e,i)=>{
        const div = document.createElement('div');div.className='list-item'
        div.innerHTML = `
          <input data-i="${i}" class="small" placeholder="Role — Org" value="${escapeHtml(e.role+' — '+e.org)}">
          <button data-i="${i}" class="small btn-ghost">✕</button>
        `
        experienceList.appendChild(div)
      })
      educationList.innerHTML=''
      state.education.forEach((e,i)=>{
        const div = document.createElement('div');div.className='list-item'
        div.innerHTML = `
          <input data-i="edu-${i}" class="small" placeholder="Degree — School" value="${escapeHtml(e.degree+' — '+e.org)}">
          <button data-i="edu-${i}" class="small btn-ghost">✕</button>
        `
        educationList.appendChild(div)
      })
    }

    function renderPreview(){
      document.documentElement.style.setProperty('--accent', state.accent)
      resumeContainer.className = 'resume '+state.template

      const skillsHtml = state.skills.map(s=>`<div class="skill">${escapeHtml(s)}</div>`).join('')
      const expHtml = state.experience.map(e=>`<div class="job"><strong>${escapeHtml(e.role)}</strong> — <em>${escapeHtml(e.org)}</em><div class="muted">${escapeHtml(e.period||'')}</div><div>${escapeHtml(e.desc||'')}</div></div>`).join('')
      const eduHtml = state.education.map(e=>`<div class="job"><strong>${escapeHtml(e.degree)}</strong><div class="muted">${escapeHtml(e.org)} ${escapeHtml(e.period||'')}</div></div>`).join('')

      const templateInner = `
        <div class="header"><div class="name">${escapeHtml(state.name)}</div>
        <div class="contact">${escapeHtml(state.title)}<br>${escapeHtml(state.contact)}</div></div>
        <div class="section"><h3>Experience</h3>${expHtml}</div>
        <div class="section"><h3>Education</h3>${eduHtml}</div>
        <div class="section"><h3>Skills</h3><div class="skills">${skillsHtml}</div></div>
      `

      // Adjust layout for sidebar or compact templates
      if(state.template === 'tpl-sidebar'){
        resumePreview.innerHTML = `<div>${templateInner}</div><div class="sidebar"><div class="section"><h3>Side</h3><div class="muted">Add quick notes here</div></div></div>`
      } else if(state.template === 'tpl-compact'){
        resumePreview.innerHTML = `<div class="two-col">${templateInner}${templateInner}</div>`
      } else {
        resumePreview.innerHTML = templateInner
      }
    }

    // Helpers
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" }[c]))}

    // Sync editor values
    function bindEvents(){
      templateSelect.addEventListener('change',e=>{state.template=e.target.value;renderPreview()})
      accentColor.addEventListener('input',e=>{state.accent=e.target.value;renderPreview()})
      nameInput.addEventListener('input',e=>{state.name=e.target.value;renderPreview()})
      titleInput.addEventListener('input',e=>{state.title=e.target.value;renderPreview()})
      contactInput.addEventListener('input',e=>{state.contact=e.target.value;renderPreview()})
      skillsInput.addEventListener('input',e=>{state.skills = e.target.value.split(',').map(s=>s.trim()).filter(Boolean);renderPreview()})

      addExp.addEventListener('click',()=>{state.experience.unshift({role:'New Role',org:'Company',period:'Year—Year',desc:'Describe responsibilities.'});renderEditorLists();renderPreview();})
      addEdu.addEventListener('click',()=>{state.education.unshift({degree:'New Degree',org:'School',period:'Year—Year'});renderEditorLists();renderPreview();})

      experienceList.addEventListener('input',e=>{
        const i = Number(e.target.dataset.i)
        if(!Number.isNaN(i)){
          const [role,org] = e.target.value.split(' — ').map(s=>s&&s.trim())
          state.experience[i].role = role || state.experience[i].role
          state.experience[i].org = org || state.experience[i].org
          renderPreview()
        }
      })

      educationList.addEventListener('input',e=>{
        const key = e.target.dataset.i
        if(key && key.startsWith('edu-')){
          const i = Number(key.split('-')[1])
          const [degree,org] = e.target.value.split(' — ').map(s=>s&&s.trim())
          state.education[i].degree = degree || state.education[i].degree
          state.education[i].org = org || state.education[i].org
          renderPreview()
        }
      })

      experienceList.addEventListener('click',e=>{
        if(e.target.tagName==='BUTTON'){
          const i = Number(e.target.dataset.i);if(!Number.isNaN(i)){state.experience.splice(i,1);renderEditorLists();renderPreview()}
        }
      })
      educationList.addEventListener('click',e=>{
        if(e.target.tagName==='BUTTON'){
          const key = e.target.dataset.i; if(key && key.startsWith('edu-')){const i=Number(key.split('-')[1]);state.education.splice(i,1);renderEditorLists();renderPreview()}
        }
      })

      resetBtn.addEventListener('click',()=>{location.reload()})

      exportPdf.addEventListener('click',()=>{
        // quick DOM cleanup: create a clone and remove interactive controls
        const clone = resumePreview.cloneNode(true)
        clone.style.width = '800px'
        const opt = {
          margin: 12,
          filename: (state.name||'resume').replace(/\s+/g,'_') + '.pdf',
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale:2, useCORS:true },
          jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }
        }
        html2pdf().set(opt).from(clone).save()
      })
    }

    // Initialize editor lists and preview
    function init(){
      templateSelect.value = state.template
      accentColor.value = state.accent
      nameInput.value = state.name
      titleInput.value = state.title
      contactInput.value = state.contact
      skillsInput.value = state.skills.join(', ')
      renderEditorLists();renderPreview();bindEvents();
    }

    // Sanity check: simple well-formedness test for the generated preview HTML
    function sanityCheck(){
      try{
        const parser = new DOMParser();
        const doc = parser.parseFromString(resumePreview.innerHTML,'text/html')
        const errors = doc.querySelectorAll('parsererror')
        if(errors.length>0) console.warn('Preview HTML parse errors:',errors)
      }catch(err){console.warn('Sanity check failed',err)}
    }

    // Run
    init();
    setTimeout(sanityCheck,200)
  </script>
</body>
</html>
